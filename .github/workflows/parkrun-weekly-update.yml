name: Parkrun Weekly Update

on:
  schedule:
    - cron: '0 14 * * 3' # Wednesday night 10pm AWST (14:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-parkrun:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fetch Latest Saturday Parkrun Results
        run: node parkrun/scripts/update_weekly.js

      - name: Recompile Binary Blob
        run: python3 parkrun/scripts/build_blob.py

      - name: Bust Browser Cache
        run: python3 common/scripts/update_html_version.py

      - name: Run Tests
        run: npm run test

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parkrun/data/events/*.csv parkrun/data/raw_events.csv parkrun/index.html common/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: automated weekly parkrun update"
          git pull origin main -s recursive -X ours || true
          git push origin main
