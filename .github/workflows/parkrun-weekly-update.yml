name: Parkrun Weekly Update

on:
  schedule:
    - cron: '0 5 * * 0' # Sunday afternoon: 3:00 PM AEST / 4:00 PM AEDT / 1:00 PM AWST (05:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-parkrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fetch Latest Saturday Parkrun Results & Sync Locations
        run: node parkrun/scripts/update_weekly.js --concurrency 3

      - name: Recompile Binary Blob
        run: python3 parkrun/scripts/build_blob.py

      - name: Bust Browser Cache
        run: python3 common/scripts/update_html_version.py

      - name: Run Tests
        run: npm run test

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parkrun/data/events/*.csv parkrun/data/events_catalog.json parkrun/data/raw_events.csv parkrun/index.html common/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(parkrun): automated weekly data and locations update"
          git pull origin main -s recursive -X ours || true
          git push origin main

  deploy:
    runs-on: ubuntu-latest
    needs: [update-parkrun]
    if: always() && needs.update-parkrun.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install aiohttp
          npm ci
          npx playwright install --with-deps chromium

      - name: Compile Binary Data Blobs
        run: |
          cd energy && python3 scripts/build_blob.py
          cd ..
          python3 common/scripts/ala_build.py --input-csv bogong/data/raw_events.csv --output-bin bogong/data/data.bin --output-meta bogong/data/metadata.json --output-species bogong/data/species_info.json
          python3 common/scripts/ala_build.py --input-csv christmas-beetle/data/raw_events.csv --output-bin christmas-beetle/data/data.bin --output-meta christmas-beetle/data/metadata.json --output-species christmas-beetle/data/species_info.json
          python3 parkrun/scripts/build_blob.py

      - name: Run Playwright Tests
        run: npm run test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
