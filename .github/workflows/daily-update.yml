name: Daily Energy Data Update & Deploy

on:
  schedule:
    - cron: '0 16 * * *' # Runs at midnight AWST (16:00 UTC)
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main # Automatically deploy when code is pushed to main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install aiohttp
          
      - name: Fetch Latest OpenElectricity Data
        env:
          OPENELECTRICITY_API_KEY: ${{ secrets.OPENELECTRICITY_API_KEY }}
        run: python3 scripts/update_data.py
        
      - name: Compile Binary Data Blob
        run: python3 scripts/build_blob.py
        
      - name: Bust Browser Cache
        run: python3 scripts/update_html_version.py
        
      - name: Commit Source Updates to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/energy/raw_events.csv energy.html
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: automated daily data update"
          git push origin main
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
