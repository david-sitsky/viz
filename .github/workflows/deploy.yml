name: Deploy & Update Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 16 * * *' # Runs at midnight AWST (16:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install aiohttp
          
      - name: Fetch Latest OpenElectricity Data
        env:
          OPENELECTRICITY_API_KEY: ${{ secrets.OPENELECTRICITY_API_KEY }}
        run: cd energy && python3 scripts/update_data.py
        
      - name: Fetch Latest ALA Bogong Data
        run: python3 common/scripts/ala_sync.py --query "Agrotis infusa" --output bogong/data/raw_events.csv
        
      - name: Fetch Latest ALA Christmas Beetle Data
        run: python3 common/scripts/ala_sync.py --query "genus:Anoplognathus" --output christmas-beetle/data/raw_events.csv
        
      - name: Bust Browser Cache
        run: python3 common/scripts/update_html_version.py
        
      - name: Commit Source Updates to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: automated daily data update"
          git pull origin main -s recursive -X ours
          git push origin main

  deploy:
    runs-on: ubuntu-latest
    needs: [update-data]
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install aiohttp
          npm ci
          npx playwright install --with-deps chromium
          
      - name: Compile Binary Data Blobs
        run: |
          cd energy && python3 scripts/build_blob.py
          cd ..
          python3 common/scripts/ala_build.py --input-csv bogong/data/raw_events.csv --output-bin bogong/data/data.bin --output-meta bogong/data/metadata.json --output-species bogong/data/species_info.json
          python3 common/scripts/ala_build.py --input-csv christmas-beetle/data/raw_events.csv --output-bin christmas-beetle/data/data.bin --output-meta christmas-beetle/data/metadata.json --output-species christmas-beetle/data/species_info.json
          
      - name: Run Playwright Tests
        run: npm run test
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
