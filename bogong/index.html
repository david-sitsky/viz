<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bogong Moth Visualiser</title>
  <meta name="description" content="Interactive animated map showing Bogong moth sightings over time">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../common/styles.css?v=202610061757">
  <style>
    /* Moth SVG styling */
    .moth-icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -0.125em;
      fill: currentColor;
    }
    .loading-icon .moth-icon {
      width: 64px;
      height: 64px;
      color: #F59E0B;
    }
    .stat-label .moth-icon {
      color: #F59E0B;
      margin-right: 4px;
    }
    .attribution {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      text-align: right;
      margin-top: 4px;
      padding-right: 4px;
    }
    .attribution a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }
    .attribution a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>
</head>
<body>
  <input type="checkbox" id="mobile-toggle" style="display: none;">

  <!-- ─── Map ─── -->

  <div id="map-container"></div>

  <!-- ─── Loading ─── -->
  <div id="loading-overlay">
    <div class="loading-card">
      <div class="loading-icon">
        <svg class="moth-icon" viewBox="0 0 24 24" stroke="none">
          <path d="M12 4c-1-2-4-2-4-2s1 1 2 2" stroke="currentColor" stroke-width="1.5" fill="none"/>
          <path d="M12 4c1-2 4-2 4-2s-1 1-2 2" stroke="currentColor" stroke-width="1.5" fill="none"/>
          <ellipse cx="12" cy="11" rx="2" ry="7" />
          <path d="M10 6C5 4 2 7 2 12c0 4 3 7 8 2V6z" opacity="0.9"/>
          <path d="M14 6c5-2 8 1 8 6 0 4-3 7-8 2V6z" opacity="0.9"/>
        </svg>
      </div>
      <h1 class="loading-title">Bogong Moth Tracker</h1>
      <p class="loading-subtitle">Australia's Bogong Moths Over Time</p>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <p class="loading-status" id="loading-status">Initializing...</p>
    </div>
  </div>

  <!-- ─── Top-Left Panel: Controls + Stats ─── -->
  <div id="top-left-panel">
    <!-- Stats Bar -->
    <header id="stats-bar" class="glass hidden" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 16px;">
          <div class="stat">
            <span class="stat-label">📅 DATE</span>
            <span class="stat-value" id="stat-date">—</span>
          </div>
          <div class="stat-divider"></div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <a href="../" class="ctrl-btn home-nav-inline" title="Back to Visualisations" style="text-decoration: none;">🏠</a>
            <button id="btn-rewind" class="ctrl-btn" title="Restart (Home)">⏮</button>
            <button id="btn-play" class="ctrl-btn play-btn" title="Play / Pause (Space)">▶</button>
          </div>
        </div>
        <button id="btn-info" class="ctrl-btn" title="Species Info" style="width: 32px; height: 32px; font-size: 16px;">ℹ️</button>
        <label for="mobile-toggle" class="mobile-toggle-btn" id="btn-settings" style="font-size: 16px; padding: 0; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%;" title="Settings">⚙️</label>
      </div>
      <div class="controls-row" style="display: flex; gap: 15px; align-items: center; margin-bottom: 2px;">
        <div class="stat" style="flex-direction: row; align-items: center; gap: 6px;">
            <span class="stat-label" style="display: flex; align-items: center;">
              <svg class="moth-icon" viewBox="0 0 24 24" stroke="none" style="width: 24px; height: 24px;">
                <path d="M12 4c-1-2-4-2-4-2s1 1 2 2" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <path d="M12 4c1-2 4-2 4-2s-1 1-2 2" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <ellipse cx="12" cy="11" rx="2" ry="7" />
                <path d="M10 6C5 4 2 7 2 12c0 4 3 7 8 2V6z" opacity="0.9"/>
                <path d="M14 6c5-2 8 1 8 6 0 4-3 7-8 2V6z" opacity="0.9"/>
              </svg>
            </span>
            <span class="stat-value" id="stat-records">0</span>
            <span class="stat-sub">sightings</span>
          </div>
        <input type="range" id="scrubber" style="flex: 1;" class="scrubber" min="0" max="100" value="0" aria-label="Timeline">
      </div>
    </header>

    <!-- Playback Controls -->
    <footer id="controls" class="glass hidden" style="margin-top: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px;">
        <div class="speed-ctrl" style="margin: 0;">
          <span style="font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.65);">SPEED</span>
          <input type="range" id="speed" min="1" max="10" value="10" step="1" aria-label="Speed" style="width: 70px;">
          <span id="speed-val" style="font-size: 11px;">10×</span>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <label class="fade-toggle" title="Fade old recordings">
            <input type="checkbox" id="fade-toggle" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="fade-label">Fade</span>
          </label>
        </div>
      </div>
    </footer>
    
    <div class="attribution">
      Data provided by <a href="https://www.ala.org.au/" target="_blank" rel="noopener">Atlas of Living Australia</a>
    </div>
  </div>

  <!-- ─── Right Panel Column: hardcoded Bogong Moth info panel ─── -->
  <div id="right-panels">
    <div id="bogong-panel" class="species-panel glass" style="border-left-color: rgb(240, 140, 50);">
      <button id="bogong-panel-close" class="panel-close" title="Close" aria-label="Close panel">✕</button>
      <div class="panel-header">
        <img class="panel-img" src="https://media.australian.museum/media/dd/images/Agrotis_infusa.width-1200.343bb14.jpg" alt="Bogong Moth" loading="lazy">
        <div class="panel-names">
          <div class="panel-common">Bogong Moth</div>
          <div class="panel-sci">Agrotis infusa</div>
          <div class="panel-family">Noctuidae</div>
        </div>
      </div>
      <a class="panel-link" href="https://australian.museum/learn/animals/insects/bogong-moth/" target="_blank" rel="noopener">View Bogong Moth profile ↗</a>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9/dist.min.js"></script>
  <script type="module" src="js/app.js?v=202610061757"></script>
</body>
</html>
